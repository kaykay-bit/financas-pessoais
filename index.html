<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finanças Pessoais</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="cabecalho">
    <h1>💰 Finanças Pessoais</h1>
    <nav aria-label="Menu principal">
      <a href="#resumo">Resumo</a>
      <a href="#cadastro">Nova transação</a>
      <a href="#historico">Histórico</a>
    </nav>
  </header>

  <main class="conteudo">
    <section id="resumo" class="resumo" aria-label="Resumo financeiro">
      <article class="card entrada">
        <h2>Entradas</h2>
        <p id="total-entradas">R$ 0,00</p>
      </article>

      <article class="card saida">
        <h2>Saídas</h2>
        <p id="total-saidas">R$ 0,00</p>
      </article>

      <article class="card saldo">
        <h2>Saldo total</h2>
        <p id="saldo-total">R$ 0,00</p>
      </article>
    </section>

    <section id="cadastro" class="formulario" aria-label="Cadastro de transação">
      <h2>Nova transação</h2>

      <form id="form-transacao">
        <label for="nome">Nome da transação</label>
        <input
          type="text"
          id="nome"
          name="nome"
          placeholder="Ex.: Salário, Mercado, Conta de luz"
          required
          minlength="2"
        />

        <label for="valor">Valor (R$)</label>
        <input
          type="number"
          id="valor"
          name="valor"
          placeholder="Ex.: 1500"
          min="0.01"
          step="0.01"
          required
        />

        <label for="tipo">Tipo</label>
        <select id="tipo" name="tipo" required>
          <option value="" disabled selected>Selecione</option>
          <option value="entrada">Entrada</option>
          <option value="saida">Saída</option>
        </select>

        <button type="submit">Adicionar</button>
      </form>
    </section>

    <section id="historico" class="historico" aria-label="Histórico de transações">
      <h2>Histórico de transações</h2>

      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Transação</th>
              <th>Valor</th>
              <th>Tipo</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="lista-transacoes">
            <!-- As transações serão inseridas pelo JavaScript -->
          </tbody>
        </table>
      </div>

      <p id="mensagem-vazia" class="mensagem-vazia">
        Nenhuma transação cadastrada ainda.
      </p>
    </section>
  </main>

  <footer class="rodape">
    <p>Projeto acadêmico — Desenvolvimento Front-End e Versionamento</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
